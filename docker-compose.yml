services:

  mysql:
    image: mysql:8.0
    container_name: memeshift_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-memeshift}
      MYSQL_USER: ${DB_USERNAME:-memeshift}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod

  laravel:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: memeshift_laravel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://example.com}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-memeshift}
      DB_USERNAME: ${DB_USERNAME:-memeshift}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-example.com}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.example.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://example.com}
      SESSION_DRIVER: file
      CACHE_DRIVER: file
    volumes:
      - laravel_storage:/var/www/html/storage
    profiles:
      - prod

  laravel-dev:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: memeshift_laravel_dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - laravel_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-memeshift}
      DB_USERNAME: ${DB_USERNAME:-memeshift}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8081}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-.localhost}
      SESSION_DRIVER: file
      CACHE_DRIVER: file
    profiles:
      - dev

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_SANCTUM_URL: "/api"
    container_name: memeshift_nextjs
    restart: unless-stopped
    depends_on:
      - laravel
    environment:
      NODE_ENV: production
    profiles:
      - prod

  nextjs-dev:
    build:
      context: .
      dockerfile: docker/nextjs/Dockerfile
      target: deps
    container_name: memeshift_nextjs_dev
    restart: unless-stopped
    depends_on:
      - laravel-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_SANCTUM_URL: "http://localhost:8081"
      NODE_ENV: development
    command: npm run dev
    profiles:
      - dev

  nginx:
    image: nginx:alpine
    container_name: memeshift_nginx
    restart: unless-stopped
    depends_on:
      - laravel
      - nextjs
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    profiles:
      - prod

  nginx-dev:
    image: nginx:alpine
    container_name: memeshift_nginx_dev
    restart: unless-stopped
    depends_on:
      - laravel-dev
      - nextjs-dev
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80"
    profiles:
      - dev

  logic:
    build:
      context: .
      dockerfile: docker/logic/Dockerfile
    container_name: memeshift_logic
    restart: unless-stopped
    stdin_open: true
    tty: true
    profiles:
      - logic

volumes:
  mysql_data:
  laravel_vendor:
  laravel_storage:
